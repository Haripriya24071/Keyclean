[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keyclean"
version = "0.1.0"
description = "Deterministic zero-latency local audio DSP pipeline for keyboard click transient suppression"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Hari Priya", email = "haripriyar891@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
